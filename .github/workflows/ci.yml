name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsc needs the generated Prisma client types.
      - run: pnpm --filter @catgpt/db exec prisma generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @catgpt/api test
