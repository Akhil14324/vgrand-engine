# Local development infrastructure.
# Postgres stands in for Supabase Postgres until you plug in real Supabase env vars.
# Redis backs the BullMQ generation queue.
services:
  postgres:
    # pgvector build of PG16 — adds the `vector` extension for PDF RAG chunks.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: catgpt
      POSTGRES_DB: catgpt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catgpt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
